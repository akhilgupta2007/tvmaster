version: '3.8'

services:
  tvmaster:
    build: .
    image: tvmaster:1.3.1
    container_name: tvmaster
    restart: unless-stopped
    ports:
      - "3055:3055"
    environment:
      - PORT=3055
      - NODE_ENV=production
      # Optional: set your TV IP to auto-connect on startup
      # - TV_IP=192.168.1.145
    volumes:
      # Persist ADB keys so you only click "Allow USB Debugging" on TV once
      - tvmaster-adb-keys:/root/.android
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3055/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tvmaster-adb-keys:
    name: tvmaster_adb_keys
