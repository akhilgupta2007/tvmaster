version: '3.8'

services:
  tvmaster:
    image: ghcr.io/akhilgupta2007/tvmaster:latest
    container_name: tvmaster
    restart: unless-stopped
    ports:
      - "3055:3055"
    environment:
      - PORT=3055
      - NODE_ENV=production
      # Optional: set your TV IP to auto-connect on startup
      # - TV_IP=10.0.0.13
    volumes:
      # Persist ADB keys so you only click "Allow USB Debugging" on TV once
      - tvmaster-adb-keys:/root/.android
      # Persist saved TV devices & configuration
      - tvmaster-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3055/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tvmaster-adb-keys:
    name: tvmaster_adb_keys
  tvmaster-data:
    name: tvmaster_data

