<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.5"/>
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- TV Display Bezel -->
  <rect x="22" y="24" width="84" height="58" rx="10" fill="url(#screenGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- TV Screen Inner Grid Subtle Lines -->
  <line x1="24" y1="43" x2="104" y2="43" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="24" y1="63" x2="104" y2="63" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="50" y1="26" x2="50" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="78" y1="26" x2="78" y2="80" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Telemetry Pulse Waveform / Lightning Heartbeat (Glowing Neon) -->
  <path d="M 26 53 L 42 53 L 48 37 L 54 69 L 62 44 L 68 59 L 74 53 L 102 53" 
        fill="none" 
        stroke="url(#neonCyan)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#cyanGlow)"/>

  <!-- Telemetry Live Pulse Point -->
  <circle cx="62" cy="44" r="3" fill="#ffffff" filter="url(#cyanGlow)"/>

  <!-- TV Stand Base -->
  <path d="M 52 83 L 46 95 L 82 95 L 76 83" fill="#1e293b" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
  <line x1="42" y1="95" x2="86" y2="95" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Status Indicator Dot -->
  <circle cx="98" cy="32" r="2.5" fill="#10b981"/>
</svg>